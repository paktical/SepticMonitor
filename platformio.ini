; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Single active environment for now. include/config_dev.h supplies the settings.
; A release profile (include/config_release.h) is kept for later -- to enable it,
; add an [env:release] section with -DCONFIG_RELEASE and list it in default_envs.

[platformio]
default_envs = dev

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.arduino.partitions = default_16MB.csv

; No -DBOARD_HAS_PSRAM: this board is the N8 variant with no PSRAM chip, and the
; flag made the core fail init with "PSRAM ID read error / chip not found".
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit ADS1X15@^2.4.0
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0

; Build settings here are deliberately identical to the original single-env setup
; that was known to connect. The only difference is -DCONFIG_DEV selecting the
; config header. Do not add build_type/CORE_DEBUG_LEVEL back without testing --
; verbose core logging over USB CDC was suspected of stalling WiFi association.
[env:dev]
build_flags =
    ${env.build_flags}
    -DCONFIG_DEV
